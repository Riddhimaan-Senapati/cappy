<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark class fixture</title>
<style>
  html { background: #fff; color: #222; }
  body { font-family: sans-serif; margin: 8px; }
  main { padding: 24px; }
  html.dark { background: #111; color: #eee; }
</style>
</head>
<body>
<main>
  <h1>Class-based dark theme</h1>
  <p>This page only goes dark when its own dark class is on the root element.</p>
</main>
</body>
</html>
