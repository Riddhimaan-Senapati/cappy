<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM exchanges · Cappy</title>
<style>
:root{color-scheme:light;--ink:#172e2c;--muted:#657873;--line:#dce4df;--green:#17634b}*{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:var(--ink);font:14px/1.55 system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:20px}h1{font-size:23px;letter-spacing:-.7px;margin:0}header p{margin:2px 0;color:var(--muted)}.brand{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--green)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px}button:hover{border-color:var(--green)}header button{margin-left:auto}main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 110px)}aside{border-right:1px solid var(--line);padding:22px 16px;background:#edf1eb}input{width:100%;border:1px solid #ccd8cf;background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:14px}#count,.muted{color:var(--muted);font-size:12px}#runs{display:grid;gap:8px;margin-top:14px}.run{text-align:left;padding:14px;border:1px solid transparent;background:transparent;min-width:0}.run.active{background:#fff;border-color:#b4cdbd;box-shadow:0 3px 10px #173c2810}.run strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.run small{display:block;color:var(--muted);margin-top:6px}.content{padding:28px 36px;max-width:1200px;width:100%}h2{font-size:25px;line-height:1.3;letter-spacing:-.5px;margin:8px 0 12px;overflow-wrap:anywhere}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}.stat{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:9px}.stat b{font-size:18px;margin-right:6px}.step{border:1px solid var(--line);background:white;border-radius:12px;margin:12px 0;overflow:hidden}.step>summary{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;list-style:none}.step>summary:after{content:'+';margin-left:auto;color:var(--muted)}.step[open]>summary:after{content:'−'}.number{background:#edf3ee;border-radius:50%;width:29px;height:29px;display:grid;place-items:center;font-size:12px;flex-shrink:0}.step-title{min-width:0;flex:1}.step-title strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.step-title small{color:var(--muted)}.badge{border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600;white-space:nowrap;background:#e7f1eb;color:#276547}.badge.tool{background:#edf0ff;color:#535da0}.badge.error{background:#fbe8e5;color:#a13c30}.body{border-top:1px solid var(--line);padding:20px}.section-title{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:4px 0 12px}.part{padding:12px 14px;background:#f6f8f5;border-radius:8px;margin:8px 0;border-left:3px solid #c6d6c9}.part.tool{border-color:#959ed8}.part.error{border-color:#ce8276}.part.thought{color:var(--muted)}pre{font:12px/1.7 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;max-height:420px;overflow:auto}.text{white-space:pre-wrap;overflow-wrap:anywhere}.part details summary,details.extra>summary{cursor:pointer;color:var(--green);font-size:12px}.part-title{font-weight:600;font-size:13px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}.extra{margin-top:15px;padding-top:12px;border-top:1px solid var(--line)}.gallery{display:flex;gap:10px;flex-wrap:wrap}.gallery a{display:block;max-width:300px}.gallery img{display:block;width:100%;border-radius:6px;border:1px solid var(--line)}.empty{padding:70px 20px;text-align:center;color:var(--muted)}#status{font-size:12px;color:var(--muted)}a{color:var(--green)}@media(max-width:850px){main{grid-template-columns:250px minmax(0,1fr)}.columns{grid-template-columns:1fr}.content{padding:22px}}@media(max-width:600px){main{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}#runs{max-height:230px;overflow:auto}header{padding:20px}.content{padding:20px}.step>summary{gap:8px}.badge{font-size:10px}}
</style>
</head>
<body>
<header><div><div class="brand">CAPPY / OBSERVABILITY</div><h1>LLM exchanges</h1><p>One request. Every step along the way.</p></div><button id="refresh">Refresh logs</button><span id="status" role="status" aria-live="polite"></span></header>
<main><aside><input id="search" type="search" placeholder="Search requests, tools, models…" aria-label="Search logs"><div id="count"></div><nav id="runs" aria-label="Requests"></nav></aside><section class="content" id="detail"><div class="empty">Loading local logs…</div></section></main>
<script type="module">
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const format=value=>typeof value==='string'?value:JSON.stringify(value,null,2);
const time=value=>{const d=new Date(value);return Number.isNaN(+d)?'Unknown time':d.toLocaleString()};
let groups=[],selected='',query='';
function expandable(title,value){const d=el('details','extra');d.append(el('summary','',title),el('pre','',format(value)??''));return d}
function textBlock(parent,text){text=format(text)??'';parent.append(el('div','text',text.slice(0,650)));if(text.length>650)parent.append(expandable(`Read full text · ${text.length.toLocaleString()} characters`,text))}
function renderPart(part){const box=el('div','part '+part.kind);if(part.kind==='image'){if(part.available){const a=el('a');a.href=part.source;a.target='_blank';a.rel='noopener';const image=el('img');image.src=part.source;image.alt='Screenshot sent to the LLM';image.loading='lazy';a.append(image);box.classList.add('gallery');box.append(a)}else box.append(el('div','muted','Screenshot unavailable — this older log stores only a size placeholder.'),el('small','',part.source??''));return box}
if(part.kind==='tool'){box.append(el('div','part-title','↗ '+part.name),el('pre','',format(part.input)??'No arguments'))}
else if(part.kind==='result'){box.append(el('div','part-title','↙ '+part.name));textBlock(box,part.text)}
else{if(part.kind==='thought')box.append(el('div','part-title','Reasoning'));textBlock(box,part.text)}return box}
function renderSidebar(){const list=$('runs');list.replaceChildren();const visible=groups.filter(g=>JSON.stringify(g).toLowerCase().includes(query));$('count').textContent=`${visible.length} requests · ${visible.reduce((n,g)=>n+g.logs.length,0)} LLM calls`;for(const g of visible){const button=el('button','run'+(selected===g.id?' active':''));button.append(el('strong','',g.prompt.slice(0,130)),el('small','',`${time(g.logs[0].at)} · ${g.logs.length} calls`));button.onclick=()=>select(g.id);list.append(button)}if(!visible.length)list.append(el('p','muted','No matching logs.'))}
function select(id){selected=id;renderSidebar();const g=groups.find(g=>g.id===id);const root=$('detail');root.replaceChildren();if(!g){root.append(el('div','empty','No logs yet. Enable log_llm_requests=true in .env and make a request.'));return}root.append(el('div','eyebrow','Request timeline'),el('h2','',g.prompt),el('div','muted',time(g.logs[0].at)));const stats=el('div','stats');for(const [n,label]of [[g.logs.length,'LLM calls'],[g.logs.filter(l=>l.kind==='tool').length,'tool-use steps'],[g.logs.reduce((n,l)=>n+(l.inputTokens||0)+(l.outputTokens||0),0).toLocaleString(),'total tokens']]){const s=el('div','stat');s.append(el('b','',String(n)),document.createTextNode(label));stats.append(s)}root.append(stats);
g.logs.forEach((log,index)=>{const d=el('details','step');const s=el('summary');const title=el('div','step-title');title.append(el('strong','',log.tools?.length?log.tools.join(' → '):log.summary||'Model response'),el('small','',`${log.model??'Unknown model'} · ${time(log.at)} · ${((log.inputTokens||0)+(log.outputTokens||0)).toLocaleString()} tokens`));s.append(el('span','number',String(index+1)),title,el('span','badge '+log.kind,log.kind==='tool'?'Tool use':log.kind==='error'?'Error':'Reply'));d.append(s);let loaded=false;d.addEventListener('toggle',async()=>{if(!d.open||loaded)return;loaded=true;const body=el('div','body','Loading exchange…');d.append(body);try{const r=await fetch('/api/llm-logs/'+encodeURIComponent(log.id));if(!r.ok)throw Error('Could not read this log');const data=await r.json();body.replaceChildren();const columns=el('div','columns');for(const [name,parts]of [['Sent to LLM · latest input',data.request],['LLM response',data.response]]){const col=el('div');col.append(el('div','section-title',name));for(const p of parts)col.append(renderPart(p));if(!parts.length)col.append(el('div','muted','No text or tool calls returned.'));columns.append(col)}body.append(columns);if(data.screenshots.length){const gallery=el('div');gallery.append(el('div','section-title','Screenshots in context'));data.screenshots.forEach(p=>gallery.append(renderPart(p)));body.append(gallery)}if(data.system)body.append(expandable('System prompt (repeated context)',data.system));body.append(expandable('Full request and response',data.raw));const link=el('a','','Open exchange JSON');link.href='/api/llm-logs/'+encodeURIComponent(log.id);link.target='_blank';link.rel='noopener';body.append(link)}catch(e){body.textContent=e.message;loaded=false}});root.append(d);if(index===g.logs.length-1)d.open=true})}
async function refresh(){const button=$('refresh');button.disabled=true;$('status').textContent='Loading…';try{const r=await fetch('/api/llm-logs');if(!r.ok)throw Error('Could not load logs');const logs=await r.json();const buckets=new Map();groups=[];for(const log of logs){let group=buckets.get(log.group);const last=group?.logs.at(-1);const exact=log.id.includes('--run-');if(!group||(!exact&&last&&(log.depth<=last.depth||new Date(log.at)-new Date(last.at)>300000))){group={id:log.id,prompt:log.prompt,logs:[]};buckets.set(log.group,group);groups.push(group)}group.logs.push(log)}groups.reverse();select(groups.some(g=>g.id===selected)?selected:groups[0]?.id??'');$('status').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){$('status').textContent=e.message}finally{button.disabled=false}}
$('refresh').onclick=refresh;$('search').oninput=e=>{query=e.target.value.toLowerCase();renderSidebar()};refresh();
</script>
</body>
</html>
