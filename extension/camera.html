<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Camera</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0e12; overflow: hidden; font: 12px system-ui, sans-serif; color: #c9c9d3; }
      .stage { position: relative; width: 100%; height: 100%; }
      video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      video { opacity: 0.55; }
      .status { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; text-align: center; background: rgba(14, 14, 18, 0.75); }
    </style>
  </head>
  <body>
    <div class="stage">
      <video playsinline muted></video>
      <canvas></canvas>
      <div class="status">Starting camera</div>
    </div>
    <script type="module" src="dist/camera.js"></script>
  </body>
</html>
