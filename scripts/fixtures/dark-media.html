<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark media fixture</title>
<style>
  body { background: #fff; color: #222; font-family: sans-serif; margin: 8px; }
  main { padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
</style>
</head>
<body>
<main>
  <h1>Media-query dark theme</h1>
  <p>This page only goes dark when the operating system asks for dark colors.</p>
</main>
</body>
</html>
