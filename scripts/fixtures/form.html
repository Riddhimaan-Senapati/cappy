<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact form</title>
  </head>
  <body>
    <h1>Contact us</h1>
    <form action="#">
      <input id="full-name" type="text" placeholder="Full name" tabindex="3" />
      <input id="email" type="email" placeholder="Email address" required tabindex="1" />
      <input id="phone" type="tel" placeholder="Phone number" tabindex="2" />
      <input id="city" type="text" placeholder="City" />
      <button type="submit">Send</button>
    </form>
  </body>
</html>
